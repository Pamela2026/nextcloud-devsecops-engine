version: '3.8'

services:

  nextcloud:
    image: kefaslungu/hng-nextcloud
    container_name: nextcloud
    restart: always
    volumes:
      - HNG-nginx-logs:/var/log/nginx:ro

  nginx:
    image: nginx:latest
    container_name: hng-nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - nextcloud
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - HNG-nginx-logs:/var/log/nginx

  detector:
    build: ./detector
    container_name: anomaly-detector
    restart: always
    network_mode: host
    privileged: true
    volumes:
      - HNG-nginx-logs:/logs:ro
    command: ["python", "-u", "main.py"]

volumes:
  HNG-nginx-logs:
