services:
  nextcloud:
    image: ${NEXTCLOUD_IMAGE:?}
    container_name: ${NEXTCLOUD_CONTAINER_NAME:?}
    restart: ${NEXTCLOUD_RESTART_POLICY:?}
    volumes:
      - nginx-logs:${NEXTCLOUD_NGINX_LOG_PATH:?}:ro
    cpus: ${NEXTCLOUD_CPU_LIMIT:?}
    mem_limit: ${NEXTCLOUD_MEMORY_LIMIT:?}
    healthcheck:
      test: ["CMD-SHELL", "${NEXTCLOUD_HEALTHCHECK_CMD:?}"]
      interval: ${NEXTCLOUD_HEALTHCHECK_INTERVAL:?}
      timeout: ${NEXTCLOUD_HEALTHCHECK_TIMEOUT:?}
      retries: ${NEXTCLOUD_HEALTHCHECK_RETRIES:?}
      start_period: ${NEXTCLOUD_HEALTHCHECK_START_PERIOD:?}
    networks:
      - internal

  nginx:
    image: ${NGINX_IMAGE:?}
    container_name: ${NGINX_CONTAINER_NAME:?}
    restart: ${NGINX_RESTART_POLICY:?}
    ports:
      - ${NGINX_HOST_PORT:?}:${NGINX_CONTAINER_PORT:?}
    depends_on:
      nextcloud:
        condition: service_healthy
    volumes:
      - ${NGINX_CONFIG_SOURCE:?}:${NGINX_CONFIG_TARGET:?}:ro
      - nginx-logs:${NGINX_LOG_PATH:?}
    cpus: ${NGINX_CPU_LIMIT:?}
    mem_limit: ${NGINX_MEMORY_LIMIT:?}
    healthcheck:
      test: ["CMD-SHELL", "${NGINX_HEALTHCHECK_CMD:?}"]
      interval: ${NGINX_HEALTHCHECK_INTERVAL:?}
      timeout: ${NGINX_HEALTHCHECK_TIMEOUT:?}
      retries: ${NGINX_HEALTHCHECK_RETRIES:?}
      start_period: ${NGINX_HEALTHCHECK_START_PERIOD:?}
    networks:
      - internal

  detector:
    build:
      context: ${DETECTOR_BUILD_CONTEXT:?}
    container_name: ${DETECTOR_CONTAINER_NAME:?}
    restart: ${DETECTOR_RESTART_POLICY:?}
    privileged: ${DETECTOR_PRIVILEGED:?}
    volumes:
      - nginx-logs:${DETECTOR_LOG_PATH:?}:ro
    command: ${DETECTOR_COMMAND:?}
    depends_on:
      nginx:
        condition: service_healthy
    cpus: ${DETECTOR_CPU_LIMIT:?}
    mem_limit: ${DETECTOR_MEMORY_LIMIT:?}
    healthcheck:
      test: ["CMD-SHELL", "${DETECTOR_HEALTHCHECK_CMD:?}"]
      interval: ${DETECTOR_HEALTHCHECK_INTERVAL:?}
      timeout: ${DETECTOR_HEALTHCHECK_TIMEOUT:?}
      retries: ${DETECTOR_HEALTHCHECK_RETRIES:?}
      start_period: ${DETECTOR_HEALTHCHECK_START_PERIOD:?}
    networks:
      - internal

volumes:
  nginx-logs:
    name: ${NGINX_LOG_VOLUME_NAME:?}

networks:
  internal:
    name: ${INTERNAL_NETWORK_NAME:?}
    internal: true
